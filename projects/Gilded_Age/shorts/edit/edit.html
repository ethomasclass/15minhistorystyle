<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face {font-family: Abril; src: url(../../../../brand/fonts/AbrilFatface.woff2);}
  @font-face {font-family: Mono; src: url(../../../../brand/fonts/IBMPlexMono.woff2);}
  @font-face {font-family: Inter; font-weight: 600; src: url(../../../../brand/fonts/Inter-600.woff2);}
  @font-face {font-family: Inter; font-weight: 800; src: url(../../../../brand/fonts/Inter-800.woff2);}
  @font-face {font-family: Pen; src: url(../../../../brand/fonts/NanumPenScript.woff2);}
  @font-face {font-family: Playfair; font-weight: 900; src: url(../../../../brand/fonts/PlayfairDisplay-900.woff2);}
  html, body {margin: 0; background: #0d0c09;}
  #stage {position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0d0c09;}
  .layer {position: absolute; inset: 0; overflow: hidden;}
  .layer * {box-sizing: border-box;}
</style>
<!-- the look-dev kit and Ep1's shared edit pieces (wordAt, editFrame, cableXray, remap ...), then the vertical layer -->
<script src="../../lookdev/rig.js"></script>
<script src="../../lookdev/scene.js"></script>
<script src="../../lookdev/text.js"></script>
<script src="../../ep1/edit/edit.js"></script>
<script src="../../ep1/edit/brand.js"></script>
<script src="vedit.js"></script>
<script src="s1.js"></script>
<script src="s2.js"></script>
</head><body>
<div id="stage"><div id="A" class="layer"></div><div id="B" class="layer"></div><div id="CAP" class="layer"></div></div>
<script>
  window.drawEdit = (ch, T) => {
    const f = editFrame(ch, T);
    document.getElementById('A').innerHTML = f.a;
    const b = document.getElementById('B');
    b.innerHTML = f.b || ''; b.style.opacity = f.b ? f.mix : 0;
    document.getElementById('CAP').innerHTML = captions(ch, T);
    return document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; }))));
  };
</script>
</body></html>
